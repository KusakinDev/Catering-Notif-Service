version: '3.8'

services:
  rabbitmq:
    build:
      context: .
      dockerfile: docker/Dockerfile_rabbitmq
    image: rabbitmq:4.0-management
    hostname: rabbitmq
    restart: always
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - shared_network
      - my_bridge_network

  db:
    build:
      context: .
      dockerfile: docker/Dockerfile_db
    image: postgres:17
    ports:
      - "5433:5432"
    volumes:
      - pgdata_db_notif:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - shared_network
      - my_bridge_network

  migration:
    build:
      context: .
      dockerfile: docker/Dockerfile_migration
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - dev.env
    entrypoint: ["./wait-for-it.sh", "-t", "20", "rabbitmq:15672", "--"]
    command: ["./main"]
    networks:
      - shared_network
      - my_bridge_network

  notif_service:
    build:
      context: .
      dockerfile: docker/Dockerfile_service
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - dev.env
    ports:
      - "8082:8082"
      - "50053:50053"
    entrypoint: ["./wait-for-it.sh", "-t", "20", "rabbitmq:15672", "--"]
    command: ["./main"]
    networks:
      - shared_network
      - my_bridge_network

volumes:
  pgdata_db_notif:

networks:
  shared_network:
    external: true
  my_bridge_network:
    driver: bridge